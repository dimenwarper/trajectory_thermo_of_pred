<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Price of Remembering — an interactive explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F3;
  --card:#FDFDFB;
  --ink:#1C2B33;
  --mute:#5A6B70;
  --faint:#8A9AA0;
  --rule:#D7DED8;
  --grid:#E4E9E2;
  --heat:#C33A1E;
  --heat-soft:#F3D9D0;
  --info:#14647E;
  --info-soft:#D3E4EA;
  --free:#3E7A4E;
  --free-soft:#DCE9DC;
  --gold:#8A6D1F;
  --disp:"Fraunces",Georgia,serif;
  --body:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:19px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--info-soft)}

/* ---------- layout ---------- */
.col{max-width:680px;margin:0 auto;padding:0 22px}
.wide{max-width:860px;margin:0 auto;padding:0 22px}
section{padding:64px 0 8px}
p{margin:0 0 1.35em}
em{font-style:italic}
strong{font-weight:600}
a{color:var(--info);text-decoration-color:var(--info-soft);text-underline-offset:3px}
sub,sup{font-size:.68em}

/* ---------- typography ---------- */
.eyebrow{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--heat);font-weight:600;
  display:flex;align-items:center;gap:12px;margin-bottom:18px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
.eyebrow .n{color:var(--mute)}
h1{
  font-family:var(--disp);font-weight:560;
  font-size:clamp(42px,7.5vw,76px);line-height:1.02;
  letter-spacing:-.015em;
}
h2{
  font-family:var(--disp);font-weight:540;
  font-size:clamp(28px,4.4vw,40px);line-height:1.12;
  letter-spacing:-.01em;margin:0 0 .7em;
}
h3{
  font-family:var(--disp);font-weight:560;font-size:21px;margin:1.6em 0 .5em;
}
.lede{font-size:22px;line-height:1.55;color:var(--ink)}
.aside{
  font-size:16px;color:var(--mute);border-left:2px solid var(--rule);
  padding:.15em 0 .15em 16px;margin:1.6em 0;
}
.aside .k{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
.mth{font-family:var(--body);font-style:italic;white-space:nowrap}
.mth .r{font-style:normal;font-family:var(--mono);font-size:.85em}
.term{border-bottom:2px solid var(--info-soft);font-weight:600}
.term.hot{border-bottom-color:var(--heat-soft)}
.term.grn{border-bottom-color:var(--free-soft)}

/* ---------- hero ---------- */
header{
  padding:84px 0 30px;
  background:
    linear-gradient(var(--paper) 0%, rgba(244,246,243,0) 30%, rgba(244,246,243,0) 70%, var(--paper) 100%),
    repeating-linear-gradient(0deg, transparent 0 27px, var(--grid) 27px 28px),
    repeating-linear-gradient(90deg, transparent 0 27px, var(--grid) 27px 28px),
    var(--paper);
}
.kicker{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);margin-bottom:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--heat);display:inline-block}
.hero-sub{
  font-size:21px;line-height:1.55;color:var(--mute);max-width:600px;margin-top:26px;
}
.hero-src{
  margin-top:30px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--faint);
  border-top:1px solid var(--rule);padding-top:14px;max-width:600px;
}
.hero-src b{color:var(--mute);font-weight:600}

/* ---------- figure cards ---------- */
figure{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:6px;
  margin:38px 0;
  padding:26px 22px 18px;
  position:relative;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 23px, #EFF2ED 23px 24px);
}
figure.plain{background-image:none}
figure svg{display:block;width:100%;height:auto}
figcaption{
  font-family:var(--mono);font-size:12.5px;line-height:1.65;color:var(--mute);
  margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule);
}
figcaption b{color:var(--ink);font-weight:600}
.figtag{
  position:absolute;top:-11px;left:18px;background:var(--ink);color:var(--card);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:3px 10px;border-radius:3px;
}

/* svg shared text styles */
.sT{font-family:var(--mono);font-size:12px;fill:var(--mute)}
.sT.big{font-size:13.5px;font-weight:600;fill:var(--ink)}
.sT.hot{fill:var(--heat);font-weight:600}
.sT.cool{fill:var(--info);font-weight:600}
.sT.grn{fill:var(--free);font-weight:600}
.sI{font-family:var(--body);font-style:italic;font-size:15px;fill:var(--ink)}

/* ---------- ledger cards (signature) ---------- */
.ledger{
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:6px;
  margin:38px 0;
  font-family:var(--mono);
  overflow:hidden;
  box-shadow:0 1px 0 rgba(28,43,51,.04);
}
.ledger .lhead{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 18px;border-bottom:2px solid var(--ink);
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);
}
.ledger .lhead b{color:var(--ink)}
.lrow{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;
  padding:13px 18px;border-bottom:1px solid var(--grid);
  font-size:14px;position:relative;
}
.lrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.lrow.debit::before{background:var(--heat)}
.lrow.credit::before{background:var(--info)}
.lrow.zero::before{background:var(--faint)}
.lrow .desc{color:var(--ink)}
.lrow .desc small{display:block;color:var(--faint);font-size:12px;margin-top:2px;font-family:var(--mono)}
.lrow .amt{font-weight:600;white-space:nowrap}
.lrow.debit .amt{color:var(--heat)}
.lrow.credit .amt{color:var(--info)}
.lrow.zero .amt{color:var(--faint)}
.lrow.total{border-top:2px solid var(--ink);border-bottom:none;background:#F6F7F3}
.lrow.total .desc,.lrow.total .amt{font-weight:600;color:var(--ink);font-size:14.5px}

/* ---------- interactive widgets ---------- */
.widget{
  background:var(--card);border:1px solid var(--rule);border-radius:6px;
  margin:38px 0;padding:22px 22px 18px;position:relative;
}
.wtitle{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  font-family:var(--mono);font-size:12.5px;padding:6px 13px;border-radius:99px;
  border:1px solid var(--rule);background:var(--card);color:var(--mute);cursor:pointer;
  transition:all .15s;
}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.sliderRow{display:flex;align-items:center;gap:14px;margin:14px 0 4px;flex-wrap:wrap}
.sliderRow label{font-family:var(--mono);font-size:12.5px;color:var(--mute);white-space:nowrap}
input[type=range]{
  flex:1;min-width:160px;appearance:none;-webkit-appearance:none;height:4px;border-radius:2px;
  background:var(--rule);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ink);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--ink);
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--ink);
}
.readout{
  font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--mute);
  background:#F4F6F1;border:1px dashed var(--rule);border-radius:5px;
  padding:10px 14px;margin-top:14px;min-height:46px;
}
.readout b{color:var(--ink)}
.readout .hot{color:var(--heat);font-weight:600}
.readout .cool{color:var(--info);font-weight:600}
.readout .grn{color:var(--free);font-weight:600}

/* pull quote */
.pull{
  font-family:var(--disp);font-size:clamp(23px,3.4vw,30px);line-height:1.32;font-weight:520;
  margin:52px 0;padding:0 0 0 24px;border-left:3px solid var(--heat);
  letter-spacing:-.005em;
}
.pull i{font-style:italic}

/* divider */
.divider{display:flex;justify-content:center;gap:14px;padding:34px 0 0;color:var(--faint);font-family:var(--mono);font-size:13px}

footer{
  margin-top:80px;padding:44px 0 70px;border-top:1px solid var(--rule);
  color:var(--mute);font-size:15.5px;
}
footer .fin{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:20px}

@media (max-width:640px){
  body{font-size:17.5px}
  .lede{font-size:19.5px}
  section{padding:48px 0 4px}
  figure,.widget,.ledger{margin:28px -6px;padding-left:14px;padding-right:14px}
  .lrow{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:no-preference){
  .heatwave{animation:drift 3.2s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-5px);opacity:.5}}
  .rollball{animation:roll 5s ease-in-out infinite}
  @keyframes roll{0%,18%{transform:translate(0,0)}45%,75%{transform:translate(58px,26px)}100%{transform:translate(0,0)}}
}
</style>
</head>
<body>

<!-- ================= HERO ================= -->
{{CONTENT}}

<script>
/* ============================================================
   Shared SVG helpers
============================================================ */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, x, y, str, cls, anchor){
  const t = el("text", {x, y, class: cls || "sT"}, parent);
  if (anchor) t.setAttribute("text-anchor", anchor);
  t.textContent = str;
  return t;
}
function lerp(a,b,t){ return a + (b-a)*t; }
function interp(xs, ys, x){
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length-1]) return ys[ys.length-1];
  for (let i=0;i<xs.length-1;i++){
    if (x >= xs[i] && x <= xs[i+1]){
      const t = (x - xs[i]) / (xs[i+1]-xs[i]);
      return lerp(ys[i], ys[i+1], t);
    }
  }
  return ys[ys.length-1];
}
const CSS = getComputedStyle(document.documentElement);
const C = {
  ink: CSS.getPropertyValue('--ink').trim(),
  mute: CSS.getPropertyValue('--mute').trim(),
  faint: CSS.getPropertyValue('--faint').trim(),
  rule: CSS.getPropertyValue('--rule').trim(),
  heat: CSS.getPropertyValue('--heat').trim(),
  heatS: CSS.getPropertyValue('--heat-soft').trim(),
  info: CSS.getPropertyValue('--info').trim(),
  infoS: CSS.getPropertyValue('--info-soft').trim(),
  free: CSS.getPropertyValue('--free').trim(),
  freeS: CSS.getPropertyValue('--free-soft').trim(),
};

/* ============================================================
   Widget 1 · Window profile  (paper Table 1 + §4.1 feedback pad)
============================================================ */
const winData = {
  hmm: {
    label: "hidden-pattern world",
    ys: [0.780, 0.708, 0.687, 0.684, 0.683, 0.682, 0.681, 0.680],
    tabulated: [1,2,3,4,8],
    note: k => k===1
      ? "k = 1 is the classic 2012 bound — and the theorem says it's the <b>tightest</b> the family will ever be."
      : "The summed bound can only slide <span class='hot'>downhill</span> as the window widens (Theorem 4). Wider ≠ tighter.",
    color: C.info
  },
  echo: {
    label: "echo world (x repeats after 3 ticks)",
    ys: [1.075, 1.029, 0.478, 0.478, 0.478, 0.478, 0.478, 0.478],
    tabulated: [1,2,3,4,8],
    note: k => k<3
      ? "The window is still too short to see the echo — the repeated bit looks like a secret."
      : "<b>The cliff at k = 3.</b> Once the window spans the echo lag, the future reveals the repeat: most of the 'secret' becomes <span class='grn'>free</span>. Flatness onset reads off the world's memory span.",
    color: C.info
  },
  fb: {
    label: "feedback world (illustrative shape; endpoints from §4.1)",
    ys: [-0.230, -0.090, 0.060, 0.170, 0.240, 0.280, 0.295, 0.300],
    tabulated: [1,8],
    note: k => "<b>It rises — which is supposed to be impossible.</b> A rising summed profile <span class='hot'>falsifies</span> the assumption that the world ignores you: it's a certificate of back-action, read off pure statistics. (Note k = 1 is even negative — under feedback the old bound can go below zero; the full-future one can't.)",
    color: C.heat
  }
};
let winEnv = "hmm";
const winChart = document.getElementById("winChart");
const winKsl = document.getElementById("winK");

function drawWin(){
  const d = winData[winEnv];
  const k = +winKsl.value;
  winChart.innerHTML = "";
  const W=700, H=300, mL=64, mR=24, mT=26, mB=44;
  const svg = el("svg",{viewBox:`0 0 ${W} ${H}`}, winChart);
  const ymin = -0.35, ymax = 1.2;
  const X = kk => mL + (kk-1)/(8-1)*(W-mL-mR);
  const Y = v => mT + (ymax-v)/(ymax-ymin)*(H-mT-mB);
  // gridlines
  [0,0.5,1.0].forEach(v=>{
    el("line",{x1:mL,x2:W-mR,y1:Y(v),y2:Y(v),stroke:C.rule,"stroke-width":1},svg);
    txt(svg, mL-10, Y(v)+4, v.toFixed(1), "sT","end");
  });
  // zero line emphasis if fb
  if (winEnv==="fb"){
    el("line",{x1:mL,x2:W-mR,y1:Y(0),y2:Y(0),stroke:C.mute,"stroke-width":1.4,"stroke-dasharray":"5 4"},svg);
  }
  // x labels
  for(let kk=1;kk<=8;kk++) txt(svg, X(kk), H-18, kk, "sT","middle");
  txt(svg, (mL+W-mR)/2, H-2, "window width k  (1 = the 2012 bound · 8 = the full-future cryptic bound)", "sT","middle");
  txt(svg, 16, mT-8, "summed bound (nats)", "sT");
  // line
  let path = "";
  d.ys.forEach((v,i)=>{ path += (i? " L ":"M ") + X(i+1) + " " + Y(v); });
  el("path",{d:path, fill:"none", stroke:d.color, "stroke-width":3, "stroke-linejoin":"round"},svg);
  // points
  d.ys.forEach((v,i)=>{
    const kk=i+1;
    const tab = d.tabulated.includes(kk);
    el("circle",{cx:X(kk),cy:Y(v),r:tab?5:3.2,fill:tab?d.color:"#fff",stroke:d.color,"stroke-width":2},svg);
  });
  // annotations
  if (winEnv==="echo"){
    el("line",{x1:X(3),x2:X(3),y1:mT,y2:H-mB,stroke:C.faint,"stroke-width":1,"stroke-dasharray":"3 4"},svg);
    txt(svg, X(3)+7, mT+14, "cliff = echo lag", "sT");
  }
  if (winEnv==="fb"){
    txt(svg, X(6), Y(0.30)-14, "rising ⇒ the world is listening", "sT hot","middle");
  }
  if (winEnv==="hmm"){
    txt(svg, X(2)+8, Y(0.780)-10, "tightest at k = 1", "sT cool");
  }
  // marker at k
  const kv = d.ys[k-1];
  el("line",{x1:X(k),x2:X(k),y1:Y(kv),y2:H-mB,stroke:d.color,"stroke-width":1.2,"stroke-dasharray":"2 3"},svg);
  el("circle",{cx:X(k),cy:Y(kv),r:8,fill:"none",stroke:C.ink,"stroke-width":2},svg);
  txt(svg, X(k), Y(kv)-14, kv.toFixed(3), "sT big","middle");

  document.getElementById("winKval").textContent = "k = "+k;
  document.getElementById("winRead").innerHTML =
    `<b>${d.label}</b> · summed bound at k = ${k}: <b>${kv.toFixed(3)} nats</b>.<br>${d.note(k)}` +
    (d.tabulated.length<8 ? " <span style='color:var(--faint)'>Solid dots = our exact table values; small dots interpolated.</span>" : "");
}
document.getElementById("envChips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  document.querySelectorAll("#envChips .chip").forEach(c=>c.classList.remove("on"));
  b.classList.add("on"); winEnv = b.dataset.env; drawWin();
});
winKsl.addEventListener("input", drawWin);
drawWin();

/* ============================================================
   Widget 2 · Hybrid bound  (paper Table 2)
============================================================ */
const hyb = {
  r:      [0.30, 0.50, 0.70, 0.90, 1.00],
  W:      [2.105, 3.362, 4.700, 6.044, 6.675],
  cry:    [0.088, 0.273, 0.605, 1.155, 1.548],
  hybrid: [1.552, 2.611, 3.971, 5.675, 6.675]
};
const hybChart = document.getElementById("hybChart");
const hybSl = document.getElementById("hybR");
function drawHyb(){
  const r = 0.30 + (hybSl.value/100)*0.70;
  const W_ = interp(hyb.r, hyb.W, r);
  const cry = interp(hyb.r, hyb.cry, r);
  const hb  = interp(hyb.r, hyb.hybrid, r);
  const kin = hb - cry;
  const gap = W_ - hb;
  hybChart.innerHTML = "";
  const W=700, H=240, mL=24, mR=24;
  const svg = el("svg",{viewBox:`0 0 ${W} ${H}`}, hybChart);
  const maxW = 6.9;
  const BX = v => mL + v/maxW*(W-mL-mR);
  const barY=76, barH=54;
  // hatch pattern for kinetic
  const defs = el("defs",{},svg);
  const pat = el("pattern",{id:"hatch",width:"7",height:"7",patternUnits:"userSpaceOnUse",patternTransform:"rotate(45)"},defs);
  el("rect",{width:7,height:7,fill:C.heatS},pat);
  el("line",{x1:0,y1:0,x2:0,y2:7,stroke:C.heat,"stroke-width":2.2},pat);
  // total outline
  txt(svg, mL, 40, "the true heat bill, and how much of it the bounds explain:", "sT");
  el("rect",{x:BX(0),y:barY,width:BX(W_)-BX(0),height:barH,fill:"#F1F3EE",stroke:C.ink,"stroke-width":2},svg);
  // info fill
  el("rect",{x:BX(0),y:barY,width:Math.max(0,BX(cry)-BX(0)),height:barH,fill:C.infoS,stroke:C.info,"stroke-width":1.6},svg);
  // kinetic fill
  el("rect",{x:BX(cry),y:barY,width:Math.max(0,BX(hb)-BX(cry)),height:barH,fill:"url(#hatch)",stroke:C.heat,"stroke-width":1.6},svg);
  // labels
  txt(svg, BX(cry/2), barY+barH/2+4, "info", "sT cool","middle");
  txt(svg, BX(cry + kin/2), barY+barH/2+4, "hardware charge", "sT hot","middle");
  if (gap > 0.25) txt(svg, BX(hb + gap/2), barY+barH/2+4, "unexplained", "sT","middle");
  // total bracket
  el("line",{x1:BX(W_),x2:BX(W_),y1:barY-10,y2:barY+barH+10,stroke:C.ink,"stroke-width":2},svg);
  txt(svg, Math.min(BX(W_)+8, W-150), barY-16, `total dissipated = ${W_.toFixed(2)} nats`, "sT big");
  // scale
  [0,2,4,6].forEach(v=>{
    el("line",{x1:BX(v),x2:BX(v),y1:barY+barH+14,y2:barY+barH+20,stroke:C.faint,"stroke-width":1},svg);
    txt(svg, BX(v), barY+barH+36, v+" nats", "sT","middle");
  });
  // legend
  const ly=200;
  el("rect",{x:mL,y:ly,width:14,height:14,fill:C.infoS,stroke:C.info,"stroke-width":1.5},svg);
  txt(svg, mL+22, ly+12, "information bound (cryptic)", "sT");
  el("rect",{x:mL+260,y:ly,width:14,height:14,fill:"url(#hatch)",stroke:C.heat,"stroke-width":1.5},svg);
  txt(svg, mL+282, ly+12, "+ the one-number Dobrushin charge (1−r)·R", "sT");
  const pct = Math.round(100*hb/W_), pctI = Math.round(100*cry/W_);
  document.getElementById("hybRval").textContent = "r = "+r.toFixed(2);
  document.getElementById("hybRead").innerHTML =
    `At relaxation <b>r = ${r.toFixed(2)}</b>: information alone explains <span class="cool">${pctI}%</span> of the heat. ` +
    `Add the single hardware number and the hybrid bound explains <span class="hot">${pct}%</span>.` +
    (r>0.99 ? " <b>At r = 1 the bound is exact — the ledger closes to the last decimal.</b>"
            : " Slide right: the more completely the machine relaxes, the tighter the account.");
}
hybSl.addEventListener("input", drawHyb);
drawHyb();

/* ============================================================
   Widget 3 · Chaos knee  (§6: skew tent a=0.6, λ=0.673)
============================================================ */
const LAM = 0.673;
let chaosP = 10;
const chaosChart = document.getElementById("chaosChart");
function chaosCurve(p, k){
  const kstar = p*Math.LN2/LAM;
  // schematic sigmoid: ~0 before knee, saturating to λ after (knee & asymptote exact)
  return LAM/(1+Math.exp(-(k-kstar)/1.15));
}
function drawChaos(){
  chaosChart.innerHTML = "";
  const W=700,H=300,mL=60,mR=24,mT=24,mB=46;
  const svg = el("svg",{viewBox:`0 0 ${W} ${H}`},chaosChart);
  const kmax=22, ymax=0.8;
  const X=k=>mL+k/kmax*(W-mL-mR), Y=v=>mT+(ymax-v)/ymax*(H-mT-mB);
  [0,0.2,0.4,0.6].forEach(v=>{
    el("line",{x1:mL,x2:W-mR,y1:Y(v),y2:Y(v),stroke:C.rule,"stroke-width":1},svg);
    txt(svg,mL-10,Y(v)+4,v.toFixed(1),"sT","end");
  });
  [0,5,10,15,20].forEach(k=>txt(svg,X(k),H-20,k,"sT","middle"));
  txt(svg,(mL+W-mR)/2,H-2,"window width k","sT","middle");
  txt(svg,14,mT-6,"per-step cryptic rate (nats)","sT");
  // asymptote
  el("line",{x1:mL,x2:W-mR,y1:Y(LAM),y2:Y(LAM),stroke:C.free,"stroke-width":1.6,"stroke-dasharray":"6 5"},svg);
  txt(svg,W-mR-4,Y(LAM)-8,"plateau = folding entropy = λ = 0.673","sT grn","end");
  // ghost curves for other p
  [6,10,14].filter(p=>p!==chaosP).forEach(p=>{
    let d="";
    for(let k=0;k<=kmax;k+=0.25){ d+=(d?" L ":"M ")+X(k)+" "+Y(chaosCurve(p,k)); }
    el("path",{d,fill:"none",stroke:C.faint,"stroke-width":1.4,"stroke-dasharray":"2 4",opacity:.6},svg);
  });
  // active curve
  let d="";
  for(let k=0;k<=kmax;k+=0.25){ d+=(d?" L ":"M ")+X(k)+" "+Y(chaosCurve(chaosP,k)); }
  el("path",{d,fill:"none",stroke:C.heat,"stroke-width":3},svg);
  // knee marker
  const kstar = chaosP*Math.LN2/LAM;
  el("line",{x1:X(kstar),x2:X(kstar),y1:Y(LAM/2)+0,y2:H-mB,stroke:C.heat,"stroke-width":1.3,"stroke-dasharray":"3 4"},svg);
  el("circle",{cx:X(kstar),cy:Y(LAM/2),r:6,fill:"#fff",stroke:C.heat,"stroke-width":2.4},svg);
  txt(svg,X(kstar),H-mB-((H-mB)-Y(LAM/2))-14, "", "sT");
  txt(svg,Math.min(X(kstar)+8,W-190),Y(LAM/2)-12,`knee at k* = p·ln2/λ ≈ ${kstar.toFixed(1)}`,"sT hot");
  const meas = {6:7, 10:11, 14:15}[chaosP];
  document.getElementById("chaosRead").innerHTML =
    `Memory precision <b>p = ${chaosP} bits</b> (resolution δ = 2<sup>−${chaosP}</sup>). Predicted knee: <b>k* ≈ ${kstar.toFixed(1)}</b>; our exact computation measures onset at <b>k = ${meas}</b>. ` +
    `Before the knee: chaos hasn't yet amplified differences past the lens — nothing looks secret. After: the fold is exposed, and the per-step cryptic rate saturates at the map's <span class="grn">information-destruction rate</span>. (Curve shape schematic; knee position and plateau are our exact values.)`;
}
document.getElementById("chaosChips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  document.querySelectorAll("#chaosChips .chip").forEach(c=>c.classList.remove("on"));
  b.classList.add("on"); chaosP=+b.dataset.p; drawChaos();
});
drawChaos();

/* ============================================================
   Widget 4 · Feedback / work extraction  (paper Table 6, r=0.5)
============================================================ */
const fb = {
  g:     [0.00, 0.30, 0.70, 0.95],
  W:     [1.107, 0.459, -0.299, -0.721],
  bound: [0.310, 0.088, -0.784, -1.680],
  orac:  [0.000, 0.240, 1.006, 1.629],
  cry:   [0.310, 0.344, 0.302, 0.085]
};
const fbChart = document.getElementById("fbChart");
const fbSl = document.getElementById("fbG");
function drawFb(){
  const g = fbSl.value/100;
  fbChart.innerHTML = "";
  const W=700,H=320,mL=64,mR=24,mT=26,mB=46;
  const svg = el("svg",{viewBox:`0 0 ${W} ${H}`},fbChart);
  const ymin=-1.9, ymax=1.4;
  const X=v=>mL+v/0.95*(W-mL-mR), Y=v=>mT+(ymax-v)/(ymax-ymin)*(H-mT-mB);
  // extraction region
  el("rect",{x:mL,y:Y(0),width:W-mL-mR,height:(H-mB)-Y(0),fill:C.freeS,opacity:.45},svg);
  txt(svg,W-mR-6,H-mB-10,"below zero: NET WORK EXTRACTED","sT grn","end");
  [-1,0,1].forEach(v=>{
    el("line",{x1:mL,x2:W-mR,y1:Y(v),y2:Y(v),stroke:v===0?C.mute:C.rule,"stroke-width":v===0?1.6:1,"stroke-dasharray":v===0?"":""},svg);
    txt(svg,mL-10,Y(v)+4,v.toFixed(0),"sT","end");
  });
  [0,0.3,0.7,0.95].forEach(v=>txt(svg,X(v),H-20,v.toFixed(2),"sT","middle"));
  txt(svg,(mL+W-mR)/2,H-2,"coupling g — probability the world copies the agent's state","sT","middle");
  txt(svg,14,mT-8,"nats","sT");
  // curves
  function pathOf(ys, col, wdt, dash){
    let d="";
    for(let gg=0; gg<=0.9501; gg+=0.01){
      d+=(d?" L ":"M ")+X(gg)+" "+Y(interp(fb.g,ys,gg));
    }
    el("path",{d,fill:"none",stroke:col,"stroke-width":wdt,"stroke-dasharray":dash||""},svg);
  }
  pathOf(fb.W, C.ink, 3);
  pathOf(fb.bound, C.info, 2.4, "7 5");
  // dots at tabulated points
  fb.g.forEach((gg,i)=>{
    el("circle",{cx:X(gg),cy:Y(fb.W[i]),r:4.5,fill:C.ink},svg);
    el("circle",{cx:X(gg),cy:Y(fb.bound[i]),r:4.5,fill:"#fff",stroke:C.info,"stroke-width":2},svg);
  });
  // legend
  el("line",{x1:mL+4,x2:mL+34,y1:mT+8,y2:mT+8,stroke:C.ink,"stroke-width":3},svg);
  txt(svg,mL+42,mT+12,"true dissipated work","sT big");
  el("line",{x1:mL+250,x2:mL+280,y1:mT+8,y2:mT+8,stroke:C.info,"stroke-width":2.4,"stroke-dasharray":"7 5"},svg);
  txt(svg,mL+288,mT+12,"our proven floor (cryptic − oracular − coding)","sT cool");
  // marker
  const Wv=interp(fb.g,fb.W,g), Bv=interp(fb.g,fb.bound,g);
  el("line",{x1:X(g),x2:X(g),y1:mT,y2:H-mB,stroke:C.faint,"stroke-width":1.1,"stroke-dasharray":"2 3"},svg);
  el("circle",{cx:X(g),cy:Y(Wv),r:7,fill:"none",stroke:C.ink,"stroke-width":2},svg);
  el("circle",{cx:X(g),cy:Y(Bv),r:7,fill:"none",stroke:C.info,"stroke-width":2},svg);
  const cry=interp(fb.g,fb.cry,g), orc=interp(fb.g,fb.orac,g);
  document.getElementById("fbGval").textContent = "g = "+g.toFixed(2);
  document.getElementById("fbRead").innerHTML =
    `<b>g = ${g.toFixed(2)}</b> · cryptic debit ≈ <span class="hot">${cry.toFixed(2)}</span>, oracular credit ≈ <span class="cool">${orc.toFixed(2)}</span> → floor ≈ <b>${Bv.toFixed(2)} nats</b>; true dissipation ≈ <b>${Wv.toFixed(2)} nats</b>. ` +
    (Wv<0 ? `<span class="grn">The bill is negative: the agent is harvesting work from order it wrote into the world — a battery it charged itself.</span>`
          : (g>0.01 ? `The oracular credit is growing; keep sliding and the account flips sign.` :
             `No feedback: zero oracular credit, and the floor is pure cryptic debit — the passive-observer law.`));
}
fbSl.addEventListener("input", drawFb);
drawFb();
</script>
